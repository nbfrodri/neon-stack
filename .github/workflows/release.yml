name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & .\test.ps1

      - name: Build
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & .\build.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist/NeonStack.exe')) {
            throw 'No se encontró dist/NeonStack.exe tras el build.'
          }
          Get-Item 'dist/NeonStack.exe' | Format-List Name, Length, LastWriteTime

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            'dist/NeonStack.exe' `
            --title "Neon Stack $tag" `
            --generate-notes `
            --verify-tag
